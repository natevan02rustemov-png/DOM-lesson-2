<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat Formu</title>
</head>
<body>

    <form id="registrationForm">
        <div>
            <label for="username">İstifadəçi adı:</label>
            <input type="text" id="username" placeholder="İstifadəçi adını daxil edin">
        </div>
        <br>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="example@mail.com">
        </div>
        <br>

        <div>
            <label for="password">Şifrə:</label>
            <input type="password" id="password" placeholder="Ən azı 6 simvol">
        </div>
        <br>

        <div>
            <label for="age">Yaş:</label>
            <input type="number" id="age" placeholder="18+">
        </div>
        <br>

        <div>
            <label>Cinsiyyət:</label>
            <label>
                <input type="radio" name="gender" value="Qadın"> Qadın
            </label>
            <label>
                <input type="radio" name="gender" value="Kişi"> Kişi
            </label>
        </div>
        <br>

        <div>
            <label>Hobbilər:</label>
            <label>
                <input type="checkbox" name="hobbies" value="Kitab oxumaq"> Kitab oxumaq
            </label>
            <label>
                <input type="checkbox" name="hobbies" value="İdman"> İdman
            </label>
            <label>
                <input type="checkbox" name="hobbies" value="Kodlaşdırma"> Kodlaşdırma
            </label>
        </div>
        <br>

        <div>
            <label for="country">Ölkə:</label>
            <input type="text" id="country" placeholder="Məsələn: Azərbaycan">
        </div>
        <br>
        <button type="submit">Göndər</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
